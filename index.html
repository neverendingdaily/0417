<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS Marketing Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>🚀</text></svg>">
    <style>
        :root{--bg-color:#fcfaf2;--card-bg:#fff;--card-hover:#fdfdf8;--text-main:#2c2925;--text-sub:#787168;--border-color:#ede8d9;--primary:#0369a1}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;padding:2rem;display:flex;justify-content:center}
        .container{max-width:1400px;width:100%}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
        h1{font-size:1.8rem;margin:0;letter-spacing:.05em}
        .controls-top{display:flex;gap:0.5rem;}
        button{cursor:pointer;padding:0.5rem 1rem;border:none;border-radius:6px;font-weight:bold;font-size:0.9rem;transition:all 0.2s;}
        .btn-edit{background:#e2e8f0;color:#334155;}
        .btn-edit.active{background:#ef4444;color:white;}
        .btn-export{background:var(--primary);color:white;}
        .add-form{background:#fff;padding:1.5rem;border-radius:12px;border:1px solid var(--border-color);margin-bottom:2rem;display:none;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:1rem;}
        .add-form.active{display:grid;}
        .form-group{display:flex;flex-direction:column;gap:0.3rem;}
        .form-group input, .form-group select{padding:0.5rem;border:1px solid #cbd5e1;border-radius:4px;font-size:0.9rem;}
        .form-full{grid-column:1 / -1;}
        .btn-add{background:#10b981;color:white;padding:0.8rem;grid-column:1 / -1;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}
        .card{background:var(--card-bg);border-radius:12px;padding:1.5rem;text-decoration:none;color:var(--text-main);transition:all .2s ease;border:1px solid var(--border-color);display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.02);position:relative;}
        .card:hover{transform:translateY(-3px);border-color:#cbd5e1;box-shadow:0 10px 20px rgba(0,0,0,.06)}
        .icon-wrap{font-size:2rem;margin-bottom:1rem;line-height:1}
        .favicon-img{width:40px;height:40px;object-fit:contain;border-radius:6px}
        .title{font-size:1.1rem;font-weight:bold;margin-bottom:.5rem}
        .desc{font-size:.85rem;color:var(--text-sub);line-height:1.4;flex-grow:1;}
        .badge{display:inline-block;padding:.2rem .5rem;border-radius:4px;font-size:.7rem;font-weight:bold;margin-bottom:1rem;width:fit-content}
        .card-edit-overlay{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.9);border-radius:12px;flex-direction:column;justify-content:center;align-items:center;gap:0.5rem;z-index:10;}
        .edit-mode .card-edit-overlay{display:flex;}
        .edit-mode.card:hover{transform:none;}
        .action-btn{padding:0.4rem 1rem;font-size:1.2rem;background:#f1f5f9;border:1px solid #cbd5e1;}
        .action-btn:hover{background:#e2e8f0;}
        .delete-btn{background:#fee2e2;color:#ef4444;border-color:#fca5a5;}
        .bg-blue{background:#e0f2fe;color:#0369a1}.bg-green{background:#dcfce7;color:#15803d}.bg-purple{background:#f3e8ff;color:#7e22ce}.bg-orange{background:#ffedd5;color:#c2410c}.bg-gray{background:#f3f4f6;color:#4b5563}.bg-red{background:#fee2e2;color:#b91c1c}.bg-yellow{background:#fef9c3;color:#854d0e}.bg-teal{background:#ccfbf1;color:#0f766e}

        /* ============================================
           ログイン画面 — オーロラ背景バージョン
           ============================================ */
        .hidden { display: none !important; }

        #login-section {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #060b18;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }

        /* オーロラ用のカラーブロブ */
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            pointer-events: none;
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #3b4fd8 0%, transparent 70%);
            top: -15%; left: -10%;
            animation: drift-1 18s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            bottom: -10%; right: -5%;
            animation: drift-2 22s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #0e9f8e 0%, transparent 70%);
            top: 30%; right: 20%;
            animation: drift-3 16s ease-in-out infinite alternate;
        }
        .blob-4 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #be185d 0%, transparent 70%);
            bottom: 20%; left: 15%;
            animation: drift-4 20s ease-in-out infinite alternate;
        }

        @keyframes drift-1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift-2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, -50px) scale(1.1); }
        }
        @keyframes drift-3 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-60px, 80px) scale(0.9); }
        }
        @keyframes drift-4 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -60px) scale(1.2); }
        }

        /* 星のような微細パーティクル（CSS only） */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 15% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 50% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.4) 0%, transparent 100%);
            animation: twinkle 6s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0%   { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ログインカード */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3.5rem 3rem;
            border-radius: 28px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 32px 64px -12px rgba(0,0,0,0.6);
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(24px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 1.2rem;
            line-height: 1;
            display: block;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(99,102,241,0.6));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%       { transform: translateY(-12px) rotate(3deg); }
        }

        .login-card h2 {
            margin: 0 0 0.6rem 0;
            color: #ffffff;
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 20px rgba(99,102,241,0.4);
        }

        /* タイトルにグラデーションテキスト */
        .login-card h2 span {
            background: linear-gradient(135deg, #a5b4fc 0%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-desc {
            color: rgba(255,255,255,0.6);
            font-size: 0.92rem;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        /* Googleログインボタン */
        .btn-login-modern {
            background: rgba(255,255,255,0.92);
            color: #1e293b;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        /* シマーアニメーション */
        .btn-login-modern::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: none;
        }
        .btn-login-modern:hover::after {
            left: 150%;
            transition: left 0.6s ease;
        }
        .btn-login-modern:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-login-modern:active {
            transform: translateY(0) scale(0.98);
        }

        .google-icon { width: 22px; height: 22px; flex-shrink: 0; }

        /* 信頼バッジ */
        .login-trust {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 1.8rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
        }
        .trust-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }

        /* ポータル側のユーザー情報 */
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: bold; }
        .btn-logout { background: #f1f5f9; color: #334155; padding: 5px 10px; font-size: 0.8rem; border:none; border-radius:6px; cursor:pointer;}
        .btn-logout:hover { background: #e2e8f0; }
        
        .loading-text { text-align: center; color: #0369a1; font-weight: bold; padding: 2rem; grid-column: 1 / -1; }

@media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .login-card { padding: 2.5rem 1.8rem; }
        }

        /* ============================================
           トランジション動画用スタイル
           ============================================ */
        #video-transition-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #video-transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        #transition-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
